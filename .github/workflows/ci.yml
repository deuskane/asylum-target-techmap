name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
jobs:
#<GENERATE_BEGIN>
  sim_techmap:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_techmap

  sim_techmap_cbufg:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_techmap_cbufg

  sim_techmap_cgate:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_techmap_cgate

  sim_techmap_ibuf:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_techmap_ibuf

  sim_techmap_iobuf:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_techmap_iobuf

  sim_techmap_obuf:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_techmap_obuf

  sim_techmap_sync2dff:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_techmap_sync2dff

  sim_techmap_sync2dffrn:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_techmap_sync2dffrn

  lint_generic:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: lint_generic

  lint_ghdl:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: lint_ghdl

  lint_ghdl_synth_cgate_latch:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: lint_ghdl_synth_cgate_latch

  lint_ghdl_synth_no_cgate:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: lint_ghdl_synth_no_cgate

  lint_ghdl_synth_no_cgate_inverted:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: lint_ghdl_synth_no_cgate_inverted

  lint_ghdl_synth_sync:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: lint_ghdl_synth_sync

  syn_sync:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: syn_sync

  badges:
    needs: [sim_techmap, sim_techmap_cbufg, sim_techmap_cgate, sim_techmap_ibuf, sim_techmap_iobuf, sim_techmap_obuf, sim_techmap_sync2dff, sim_techmap_sync2dffrn, lint_generic, lint_ghdl, lint_ghdl_synth_cgate_latch, lint_ghdl_synth_no_cgate, lint_ghdl_synth_no_cgate_inverted, lint_ghdl_synth_sync, syn_sync]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: deuskane/asylum-ci/.github/workflows/badges.yml@main
    with:
      results: ${{ toJSON(needs) }}

#<GENERATE_END>
